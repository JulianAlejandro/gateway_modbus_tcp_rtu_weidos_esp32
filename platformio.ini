; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:weidos_esp32_a1]
platform = weidos-esp32
board = weidos_esp32_a1
framework = arduino

monitor_speed = 115200

lib_deps =
    https://github.com/michalmonday/CSV-Parser-for-Arduino.git

build_flags = 
    -D CORE_DEBUG_LEVEL=5
    -D CONFIG_LOG_COLORS=0
    -Isrc/modbus
    -Isrc/config
    -Isrc/display
    -Isrc/test
build_src_filter = +<*> -<test/test_firmware_menu.cpp>

; ─── Unit tests en host (sin hardware) ───
; Ejecutar: pio test -e native  (requiere GCC/MinGW)
[native]
platform = native
test_framework = unity
test_filter = test_config_logic

; ─── Firmware de prueba en ESP32 ───
; Ejecutar: pio run -e test_init -t upload  (sube firmware de prueba)
;           pio device monitor -e test_init  (abre monitor serial)
[env:test_init]
platform = weidos-esp32
board = weidos_esp32_a1
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/michalmonday/CSV-Parser-for-Arduino.git
build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -D CONFIG_LOG_COLORS=0
    -Isrc/modbus
    -Isrc/config
    -Isrc/display
    -Isrc/test
build_src_filter = +<test/test_firmware_menu.cpp> +<config/SystemConfig.cpp> +<config/SDManager.cpp> -<main.cpp> -<modbus/ModbusTcpBridge.cpp> -<modbus/InternalModbusSlave.cpp> -<modbus/ModbusInternalClient.cpp> -<display/displayOLEDManager.cpp>